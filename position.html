<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <style>
        .box{
            border: 2px dotted plum;
            width: 500px;
        }
         .ring{
           position: absolute;
               top:150px;
                left: 150px;
         }
    </style>
</head>
<body>
    <h3>CSS Position</h3>
    <ol>
        <!--flow relative-->
        <li>Static</li>
        <li>Relative</li>
        <li>Absolute</li>
        <!--scroll relative-->
        <li>Fixed</li>
        <li>Sticky</li>
    </ol>
    <div class="swim-container">
        <div class="box boy">
            <img src="images/boy.png" alt="">
        </div>
        <div class="box ring">
            <img src="images/ring.png" alt="">
        </div>
        <div class="box water">
            <img src="images/water.avif" alt="">
        </div>
    </div>
    
</body>
</html>
